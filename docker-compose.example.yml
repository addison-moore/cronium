# Cronium — production stack (pulls published images from GHCR).
#
# Quick start:
#   1. Create a .env file next to this compose file:
#
#        # Where users reach Cronium in the browser
#        AUTH_URL=http://localhost:3000
#        PUBLIC_APP_URL=http://localhost:3000
#        # Optional comma-separated exact origins; defaults to the URLs above
#        SOCKET_ALLOWED_ORIGINS=http://localhost:3000
#
#        # Secrets — generate each value:
#        AUTH_SECRET=              # openssl rand -hex 32
#        ENCRYPTION_KEY=           # openssl rand -hex 32  (must be exactly 64 hex chars)
#        CRONIUM_ORCHESTRATOR_KEY= # openssl rand -base64 32  (orchestrator service identity)
#        SOCKET_BROADCAST_KEY=     # openssl rand -base64 32  (app<->socket broadcast auth)
#        JWT_SECRET=               # openssl rand -hex 32
#        POSTGRES_PASSWORD=        # openssl rand -hex 16
#
#   2. docker compose up -d
#   3. Open http://localhost:3000 — your first visit walks you through
#      creating the admin account. Check status with: docker compose ps
#
# Headless installs (no browser step): add AUTO_SEED_ADMIN=true and
# ADMIN_USERNAME / ADMIN_EMAIL / ADMIN_PASSWORD to .env to seed the admin
# on first boot instead. There is no default admin password.
#
# For a domain deployment, set AUTH_URL / PUBLIC_APP_URL to your public URL and
# route only /api/socketio through a TLS reverse proxy to 127.0.0.1:5002 (or
# cronium-app:5002 from a proxy on this Docker network). Set
# NEXT_PUBLIC_SOCKET_URL to the public HTTPS origin. Compose binds host port
# 5002 to loopback so /broadcast/* is not independently public; those routes
# are service-only and also require SOCKET_BROADCAST_KEY. If trusted frontends use
# multiple origins, list each exact origin (scheme, host, and port) in
# comma-separated SOCKET_ALLOWED_ORIGINS.
#
# Every value below can be overridden from .env; none of this file needs
# editing for a standard deployment.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cronium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generate with openssl rand -hex 16}
      POSTGRES_DB: ${POSTGRES_DB:-cronium}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cronium}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cronium

  valkey:
    image: valkey/valkey:7-alpine
    # Security state (socket ticket consumption/revocation) must never be
    # evicted before its TTL. Writes fail closed if the memory limit is reached.
    command: valkey-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - valkey-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cronium

  cronium-app:
    image: ghcr.io/addison-moore/cronium-app:${CRONIUM_IMAGE_TAG:-latest}
    env_file:
      - path: .env
        required: false # missing values fail below with instructions
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      NODE_ENV: production
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      SOCKET_ALLOWED_ORIGINS: ${SOCKET_ALLOWED_ORIGINS:-}
      AUTH_SECRET: ${AUTH_SECRET:?generate with openssl rand -hex 32}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?generate with openssl rand -hex 32 (must be 64 hex chars)}
      # Orchestrator service identity (verifies the orchestrator on its
      # claim/heartbeat/health routes) + app<->socket broadcast auth (HI-10).
      CRONIUM_ORCHESTRATOR_KEY: ${CRONIUM_ORCHESTRATOR_KEY:?generate with openssl rand -base64 32}
      SOCKET_BROADCAST_KEY: ${SOCKET_BROADCAST_KEY:?generate with openssl rand -base64 32}
      JWT_SECRET: ${JWT_SECRET:?generate with openssl rand -hex 32}
      DATABASE_URL: postgres://${POSTGRES_USER:-cronium}:${POSTGRES_PASSWORD:?generate with openssl rand -hex 16}@postgres:5432/${POSTGRES_DB:-cronium}
      ORCHESTRATOR_URL: http://cronium-orchestrator:8080
      VALKEY_URL: valkey://valkey:6379
      # Must be reachable from the user's browser (not a Docker service name).
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:5002}
      NEXT_PUBLIC_SOCKET_PORT: ${SOCKET_PORT:-5002}
      # The first browser visit walks you through creating the admin account.
      # For headless installs, set AUTO_SEED_ADMIN=true plus ADMIN_USERNAME /
      # ADMIN_EMAIL / ADMIN_PASSWORD in .env (they pass through via env_file).
    ports:
      - "${APP_PORT:-3000}:3000"
      # Host reverse proxies can reach this loopback bind. Containerized
      # proxies should use http://cronium-app:5002 on the cronium network.
      - "127.0.0.1:${SOCKET_PORT:-5002}:5002"
    restart: unless-stopped
    networks:
      - cronium

  # Scheduling worker: dispatches due schedules into the job queue, executes
  # tool-action/HTTP jobs, sweeps expired leases, applies retention. Same image
  # as cronium-app with a different entrypoint. Without it, no scheduled events
  # run (the app shows a "scheduling is offline" banner).
  cronium-worker:
    image: ghcr.io/addison-moore/cronium-app:${CRONIUM_IMAGE_TAG:-latest}
    command: ["apps/cronium-app/scripts/start-worker.sh"]
    env_file:
      - path: .env
        required: false # missing values fail below with instructions
    depends_on:
      # App runs migrations at boot; the worker needs the schema in place.
      cronium-app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      NODE_ENV: production
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:?generate with openssl rand -hex 32}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?generate with openssl rand -hex 32 (must be 64 hex chars)}
      SOCKET_BROADCAST_KEY: ${SOCKET_BROADCAST_KEY:?generate with openssl rand -base64 32}
      JWT_SECRET: ${JWT_SECRET:?generate with openssl rand -hex 32}
      DATABASE_URL: postgres://${POSTGRES_USER:-cronium}:${POSTGRES_PASSWORD:?generate with openssl rand -hex 16}@postgres:5432/${POSTGRES_DB:-cronium}
      VALKEY_URL: valkey://valkey:6379
      SOCKET_INTERNAL_URL: http://cronium-app:5002
      WORKER_HEALTH_PORT: 5003
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5003/health', (r) => {r.resume(); r.on('end', () => process.exit(r.statusCode === 200 ? 0 : 1))}).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    networks:
      - cronium

  cronium-orchestrator:
    image: ghcr.io/addison-moore/cronium-orchestrator:${CRONIUM_IMAGE_TAG:-latest}
    env_file:
      - path: .env
        required: false # missing values fail below with instructions
    depends_on:
      cronium-app:
        condition: service_healthy
      valkey:
        condition: service_healthy
      cronium-runtime:
        condition: service_healthy
    environment:
      CRONIUM_API_ENDPOINT: http://cronium-app:3000
      # The orchestrator's service-identity credential (HI-10). The app verifies
      # it on the orchestrator-facing routes; job/execution access uses per-job
      # capability tokens instead.
      CRONIUM_API_TOKEN: ${CRONIUM_ORCHESTRATOR_KEY:?generate with openssl rand -base64 32}
      CRONIUM_ORCHESTRATOR_ID: ${ORCHESTRATOR_ID:-orchestrator-1}
      CRONIUM_CONTAINER_RUNTIME_JWT_SECRET: ${JWT_SECRET:?generate with openssl rand -hex 32}
      CRONIUM_CONTAINER_RUNTIME_BACKEND_URL: http://cronium-app:3000
      CRONIUM_CONTAINER_RUNTIME_VALKEY_URL: valkey://valkey:6379
      # Per-job runtime sidecars join this network to reach the app and Valkey;
      # must match the network name declared at the bottom of this file.
      CRONIUM_CONTAINER_RUNTIME_SHARED_NETWORK: cronium
      # SSH stays disabled unless an external launcher provides per-job OS
      # identity/container isolation. Never enable this for a shared SSH UID.
      CRONIUM_SSH_EXECUTION_ISOLATION_MODE: ${CRONIUM_SSH_EXECUTION_ISOLATION_MODE:-disabled}
      # Remote (runner) execution tunnels to this shared runtime service; must
      # match the cronium-runtime service name:port below.
      RUNTIME_HOST: cronium-runtime
      RUNTIME_PORT: 8081
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "/app/orchestrator", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Persists the payload signing key and SSH known_hosts across upgrades.
      - orchestrator-data:/app/data
    restart: unless-stopped
    user: "0:0"
    networks:
      - cronium

  cronium-runtime:
    image: ghcr.io/addison-moore/cronium-runtime:${CRONIUM_IMAGE_TAG:-latest}
    env_file:
      - path: .env
        required: false # missing values fail below with instructions
    depends_on:
      cronium-app:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      RUNTIME_PORT: 8081
      RUNTIME_JWT_SECRET: ${JWT_SECRET:?generate with openssl rand -hex 32}
      RUNTIME_BACKEND_URL: http://cronium-app:3000
      # No shared backend token (HI-10): the runtime authenticates to the app
      # with the per-job capability it extracts from the execution JWT.
      RUNTIME_VALKEY_URL: valkey://valkey:6379
      RUNTIME_LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped
    networks:
      - cronium

volumes:
  postgres-data: {}
  valkey-data: {}
  orchestrator-data: {}

networks:
  # Explicitly named so it doesn't vary with the compose project name — the
  # orchestrator attaches per-job runtime sidecars to it by this exact name.
  cronium:
    name: cronium
