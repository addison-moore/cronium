# Development infrastructure for running the Cronium app and socket server on
# the host. The scheduling worker runs in Docker with Valkey, the orchestrator,
# and the runtime API.
# Usage: ./infra/scripts/dev-docker-local-app.sh up

services:
  # Valkey (Redis-compatible) for caching and queue
  valkey:
    image: valkey/valkey:7-alpine
    container_name: cronium-valkey-dev
    command: valkey-server --appendonly yes --maxmemory ${VALKEY_MAX_MEMORY:-512mb} --maxmemory-policy noeviction --loglevel verbose
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - ../../data/valkey:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cronium-dev-network

  # Scheduling worker: uses the production worker bundle while the Next.js app
  # and socket server run on the host. The helper script rewrites loopback
  # DATABASE_URL hosts to host.docker.internal for this container.
  cronium-worker:
    build:
      context: ../..
      dockerfile: apps/cronium-app/Dockerfile
    image: cronium/worker:dev
    container_name: cronium-worker-dev
    command: ["apps/cronium-app/scripts/start-worker.sh"]
    environment:
      DATABASE_URL: ${CRONIUM_DEV_WORKER_DATABASE_URL:-${DATABASE_URL:-}}
      AUTH_URL: ${AUTH_URL:-http://localhost:5001}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5001}
      AUTH_SECRET: ${AUTH_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      SOCKET_BROADCAST_KEY: ${SOCKET_BROADCAST_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      VALKEY_URL: valkey://valkey:6379
      SOCKET_INTERNAL_URL: http://host.docker.internal:5002
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      WORKER_ID: ${WORKER_ID:-worker-dev}
      WORKER_HEALTH_PORT: 5003
      WORKER_DISPATCH_INTERVAL_MS: ${WORKER_DISPATCH_INTERVAL_MS:-5000}
      WORKER_CLAIM_INTERVAL_MS: ${WORKER_CLAIM_INTERVAL_MS:-2000}
      WORKER_MAX_CONCURRENT: ${WORKER_MAX_CONCURRENT:-10}
      CRONIUM_JOB_RETENTION_DAYS: ${CRONIUM_JOB_RETENTION_DAYS:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${WORKER_HEALTH_PORT:-5003}:5003"
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5003/health', (r) => {r.resume(); r.on('end', () => process.exit(r.statusCode === 200 ? 0 : 1))}).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - cronium-dev-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Orchestrator Service (cronium-orchestrator)
  cronium-orchestrator:
    build:
      context: ../../apps/orchestrator
      dockerfile: Dockerfile.dev
    container_name: cronium-orchestrator-dev
    environment:
      # Configuration file path
      CONFIG_FILE: /app/config/cronium-orchestrator.yaml

      # API Configuration (CRONIUM_ prefix required)
      # Point to host machine where Next.js app is running
      CRONIUM_API_ENDPOINT: http://host.docker.internal:5001
      CRONIUM_API_TOKEN: ${CRONIUM_ORCHESTRATOR_KEY}

      # Server Configuration
      CRONIUM_SERVER_ID: ${ORCHESTRATOR_ID:-dev-orchestrator-01}
      CRONIUM_SERVER_PORT: 8080
      CRONIUM_SERVER_METRICS_ENABLED: true
      CRONIUM_SERVER_METRICS_PORT: 9090

      # Jobs Configuration
      CRONIUM_JOBS_MAX_CONCURRENT: ${MAX_CONCURRENT_JOBS:-10}
      CRONIUM_JOBS_POLL_INTERVAL: ${JOB_POLL_INTERVAL:-5s}
      CRONIUM_JOBS_HEARTBEAT_INTERVAL: 30s
      CRONIUM_JOBS_TIMEOUT: 24h

      # Container Configuration
      CRONIUM_CONTAINER_DOCKER_ENDPOINT: unix:///var/run/docker.sock
      CRONIUM_CONTAINER_RUNTIME_JWT_SECRET: ${JWT_SECRET}
      CRONIUM_CONTAINER_RUNTIME_BACKEND_URL: http://host.docker.internal:5001
      CRONIUM_CONTAINER_RUNTIME_VALKEY_URL: redis://cronium-valkey-dev:6379
      CRONIUM_SSH_EXECUTION_ISOLATION_MODE: ${CRONIUM_SSH_EXECUTION_ISOLATION_MODE:-disabled}

      # Runtime API Configuration for SSH execution
      RUNTIME_HOST: runtime-api
      RUNTIME_PORT: 8089

      # Logging
      CRONIUM_LOGGING_LEVEL: debug
      CRONIUM_LOGGING_FORMAT: text

      # Direct environment variables (no prefix)
      DOCKER_HOST: unix:///var/run/docker.sock
      GO_ENV: development
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../../apps/orchestrator:/app
      - ../../apps/orchestrator/configs:/app/config:ro
      - ../../data/orchestrator:/app/data
      # Mount the payloads directory so orchestrator can access generated payloads
      - ../../apps/cronium-app/storage/payloads:/Users/addison/Code/cronium/cronium/apps/cronium-app/storage/payloads:ro
    command: air -c .air.toml
    ports:
      - "${ORCHESTRATOR_PORT:-8080}:8080"
      - "${ORCHESTRATOR_METRICS_PORT:-9090}:9090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cronium-dev-network
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Runtime API Service for SSH execution support
  runtime-api:
    build:
      context: ../../apps/runtime/cronium-runtime
      dockerfile: Dockerfile
    image: cronium/runtime-api:latest
    container_name: cronium-runtime-api-dev
    environment:
      # The runtime reads RUNTIME_-prefixed vars (internal/config/config.go:
      # applyLegacyEnvOverrides). The old block used bare PORT/JWT_SECRET/... which
      # those overrides don't read, so the service stayed on its default :8081
      # while the orchestrator tunnel dialed runtime-api:8089 — connection refused,
      # surfaced by the runner as `EOF` on cronium.output()/input(). Port 8089
      # matches the orchestrator's RUNTIME_PORT, the ports mapping, and the
      # healthcheck; RUNTIME_JWT_SECRET must match the orchestrator's
      # CRONIUM_CONTAINER_RUNTIME_JWT_SECRET so the tunnel JWT validates.
      RUNTIME_PORT: 8089
      RUNTIME_JWT_SECRET: ${JWT_SECRET}
      RUNTIME_BACKEND_URL: http://host.docker.internal:5001
      RUNTIME_VALKEY_URL: redis://cronium-valkey-dev:6379
      RUNTIME_LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "8089:8089"
    depends_on:
      valkey:
        condition: service_healthy
    links:
      - cronium-orchestrator:cronium-orchestrator
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8089/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cronium-dev-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Execution environment images - built but not run as services
  # These are used by the orchestrator for containerized script execution
  bash-executor:
    build:
      context: ../../apps/runtime/container-images/bash
      dockerfile: Dockerfile
    image: cronium/runner:bash-alpine
    container_name: cronium-bash-build
    command: /bin/true # Exit immediately after build
    profiles:
      - build-only

  nodejs-executor:
    build:
      context: ../../apps/runtime/container-images/nodejs
      dockerfile: Dockerfile
    image: cronium/runner:node-alpine
    container_name: cronium-nodejs-build
    command: /bin/true # Exit immediately after build
    profiles:
      - build-only

  python-executor:
    build:
      context: ../../apps/runtime/container-images/python
      dockerfile: Dockerfile
    image: cronium/runner:python-alpine
    container_name: cronium-python-build
    command: /bin/true # Exit immediately after build
    profiles:
      - build-only

networks:
  cronium-dev-network:
    driver: bridge
