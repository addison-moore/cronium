# From-source Cronium stack: builds the same images CI publishes
# (ghcr.io/addison-moore/cronium-*) using the Dockerfiles in apps/.
# For an image-pull deployment, use docker-compose.example.yml at the
# repo root instead (see docs/DEPLOYMENT.md).
#
# Run from the repo root:
#   docker compose -f infra/docker/docker-compose.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: cronium-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cronium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generate with openssl rand -hex 16}
      POSTGRES_DB: ${POSTGRES_DB:-cronium}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cronium}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cronium-network

  valkey:
    image: valkey/valkey:7-alpine
    container_name: cronium-valkey
    command: valkey-server --appendonly yes --maxmemory ${VALKEY_MAX_MEMORY:-256mb} --maxmemory-policy allkeys-lru
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cronium-network

  cronium-app:
    build:
      context: ../..
      dockerfile: apps/cronium-app/Dockerfile
    image: ghcr.io/addison-moore/cronium-app:${BUILD_VERSION:-latest}
    container_name: cronium-app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cronium}:${POSTGRES_PASSWORD:?generate with openssl rand -hex 16}@postgres:5432/${POSTGRES_DB:-cronium}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:?generate with openssl rand -hex 32}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?generate with openssl rand -hex 32 (must be 64 hex chars)}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?generate with openssl rand -base64 32}
      JWT_SECRET: ${JWT_SECRET:?generate with openssl rand -hex 32}
      ORCHESTRATOR_URL: http://cronium-orchestrator:8080
      VALKEY_URL: valkey://valkey:6379
      NEXT_PUBLIC_SOCKET_URL: ${SOCKET_URL:-http://localhost:5002}
      NEXT_PUBLIC_SOCKET_PORT: ${SOCKET_PORT:-5002}
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The first browser visit walks you through creating the admin account.
      # For headless installs, set AUTO_SEED_ADMIN=true plus ADMIN_USERNAME /
      # ADMIN_EMAIL / ADMIN_PASSWORD (there is no default admin password).
      AUTO_SEED_ADMIN: ${AUTO_SEED_ADMIN:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Email (optional)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      # AI (optional)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${APP_PORT:-3000}:3000"
      - "${SOCKET_PORT:-5002}:5002"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cronium-network

  cronium-orchestrator:
    build:
      context: ../..
      dockerfile: apps/orchestrator/Dockerfile
    image: ghcr.io/addison-moore/cronium-orchestrator:${BUILD_VERSION:-latest}
    container_name: cronium-orchestrator
    environment:
      CRONIUM_API_ENDPOINT: http://cronium-app:3000
      CRONIUM_API_TOKEN: ${INTERNAL_API_KEY:?generate with openssl rand -base64 32}
      CRONIUM_ORCHESTRATOR_ID: ${ORCHESTRATOR_ID:-orchestrator-1}
      CRONIUM_CONTAINER_RUNTIME_JWT_SECRET: ${JWT_SECRET:?generate with openssl rand -hex 32}
      CRONIUM_CONTAINER_RUNTIME_BACKEND_URL: http://cronium-app:3000
      CRONIUM_CONTAINER_RUNTIME_VALKEY_URL: valkey://valkey:6379
      # Per-job runtime sidecars join this network to reach the app and Valkey;
      # must match the network name declared at the bottom of this file.
      CRONIUM_CONTAINER_RUNTIME_SHARED_NETWORK: cronium-network
      # The SSH reverse tunnel for remote (runner) execution dials this shared
      # runtime service; it MUST match the cronium-runtime service name:port.
      RUNTIME_HOST: cronium-runtime
      RUNTIME_PORT: 8081
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "/app/orchestrator", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - orchestrator_data:/app/data
    depends_on:
      cronium-app:
        condition: service_healthy
      valkey:
        condition: service_healthy
      cronium-runtime:
        condition: service_healthy
    restart: unless-stopped
    user: "0:0"
    networks:
      - cronium-network

  cronium-runtime:
    build:
      context: ../../apps/runtime/cronium-runtime
      dockerfile: Dockerfile
    image: ghcr.io/addison-moore/cronium-runtime:${BUILD_VERSION:-latest}
    container_name: cronium-runtime
    environment:
      RUNTIME_PORT: 8081
      RUNTIME_JWT_SECRET: ${JWT_SECRET:?generate with openssl rand -hex 32}
      RUNTIME_BACKEND_URL: http://cronium-app:3000
      RUNTIME_BACKEND_TOKEN: ${INTERNAL_API_KEY:?generate with openssl rand -base64 32}
      RUNTIME_VALKEY_URL: valkey://valkey:6379
      RUNTIME_LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      cronium-app:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cronium-network

volumes:
  postgres_data:
    driver: local
  valkey_data:
    driver: local
  orchestrator_data:
    driver: local

networks:
  # Explicitly named so it doesn't vary with the compose project name — the
  # orchestrator attaches per-job runtime sidecars to it by this exact name.
  cronium-network:
    name: cronium-network
    driver: bridge
