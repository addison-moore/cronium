# From-source Cronium stack: builds the same images CI publishes
# (ghcr.io/addison-moore/cronium-*) using the Dockerfiles in apps/.
# For an image-pull deployment, use docker-compose.example.yml at the
# repo root instead (see docs/DEPLOYMENT.md).
#
# Run from the repo root:
#   docker compose -f infra/docker/docker-compose.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: cronium-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cronium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generate with openssl rand -hex 16}
      POSTGRES_DB: ${POSTGRES_DB:-cronium}
    # Not published on all interfaces: every consumer reaches Postgres over the
    # internal cronium-network by service name. The loopback publish is only for
    # operator tooling (psql/migrations) on the host itself.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cronium}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cronium-network

  valkey:
    image: valkey/valkey:7-alpine
    container_name: cronium-valkey
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?generate with openssl rand -hex 24}
    # requirepass gates every command (defense-in-depth against lateral movement
    # on the shared network). Never evict socket replay markers before their TTL:
    # security-sensitive writes fail closed when the memory limit is exhausted.
    command:
      [
        "sh",
        "-c",
        'exec valkey-server --requirepass "$$VALKEY_PASSWORD" --appendonly yes --maxmemory ${VALKEY_MAX_MEMORY:-256mb} --maxmemory-policy noeviction',
      ]
    # Loopback-only publish for operator tooling; consumers use the internal
    # cronium-network by service name.
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'valkey-cli -a "$$VALKEY_PASSWORD" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cronium-network

  cronium-app:
    build:
      context: ../..
      dockerfile: apps/cronium-app/Dockerfile
    image: ghcr.io/addison-moore/cronium-app:${BUILD_VERSION:-latest}
    container_name: cronium-app
    # Time to finish requests (up to 10s) and write the last audit log entries (up
    # to 5s more) before Docker kills it.
    stop_grace_period: 20s
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cronium}:${POSTGRES_PASSWORD:?generate with openssl rand -hex 16}@postgres:5432/${POSTGRES_DB:-cronium}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      SOCKET_ALLOWED_ORIGINS: ${SOCKET_ALLOWED_ORIGINS:-}
      AUTH_SECRET: ${AUTH_SECRET:?generate with openssl rand -hex 32}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?generate with openssl rand -hex 32 (must be 64 hex chars)}
      ENCRYPTION_KEYS_RETIRED: ${ENCRYPTION_KEYS_RETIRED:-}
      CRONIUM_ORCHESTRATOR_KEY: ${CRONIUM_ORCHESTRATOR_KEY:?generate with openssl rand -base64 32}
      SOCKET_BROADCAST_KEY: ${SOCKET_BROADCAST_KEY:?generate with openssl rand -base64 32}
      JWT_SECRET: ${JWT_SECRET:?generate with openssl rand -hex 32}
      ORCHESTRATOR_URL: http://cronium-orchestrator:8080
      VALKEY_URL: valkey://:${VALKEY_PASSWORD:?generate with openssl rand -hex 24}@valkey:6379
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:5002}
      NEXT_PUBLIC_SOCKET_PORT: ${SOCKET_PORT:-5002}
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The first browser visit walks you through creating the admin account.
      # For headless installs, set AUTO_SEED_ADMIN=true plus ADMIN_USERNAME /
      # ADMIN_EMAIL / ADMIN_PASSWORD (there is no default admin password).
      AUTO_SEED_ADMIN: ${AUTO_SEED_ADMIN:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Email (optional)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      # AI (optional)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CRONIUM_AI_ALLOW_PRIVATE_URLS: ${CRONIUM_AI_ALLOW_PRIVATE_URLS:-}
      # OAuth apps for tool integrations such as Google Sheets (optional)
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_MICROSOFT_CLIENT_ID: ${OAUTH_MICROSOFT_CLIENT_ID:-}
      OAUTH_MICROSOFT_CLIENT_SECRET: ${OAUTH_MICROSOFT_CLIENT_SECRET:-}
      OAUTH_MICROSOFT_TENANT_ID: ${OAUTH_MICROSOFT_TENANT_ID:-}
      OAUTH_SLACK_CLIENT_ID: ${OAUTH_SLACK_CLIENT_ID:-}
      OAUTH_SLACK_CLIENT_SECRET: ${OAUTH_SLACK_CLIENT_SECRET:-}
    ports:
      - "${APP_PORT:-3000}:3000"
      # Host reverse proxies can reach this loopback bind. Containerized
      # proxies should use http://cronium-app:5002 on the cronium network.
      - "127.0.0.1:${SOCKET_PORT:-5002}:5002"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cronium-network

  # Scheduling worker: dispatches due schedules into the job queue, executes
  # tool-action/HTTP jobs, sweeps expired leases, applies retention. Same image
  # as cronium-app with a different entrypoint.
  cronium-worker:
    build:
      context: ../..
      dockerfile: apps/cronium-app/Dockerfile
    image: ghcr.io/addison-moore/cronium-app:${BUILD_VERSION:-latest}
    container_name: cronium-worker
    command: ["apps/cronium-app/scripts/start-worker.sh"]
    # Time to finish running jobs (up to 30s) and write their audit log entries (up
    # to 5s more) before Docker kills it.
    stop_grace_period: 40s
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cronium}:${POSTGRES_PASSWORD:?generate with openssl rand -hex 16}@postgres:5432/${POSTGRES_DB:-cronium}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:?generate with openssl rand -hex 32}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?generate with openssl rand -hex 32 (must be 64 hex chars)}
      ENCRYPTION_KEYS_RETIRED: ${ENCRYPTION_KEYS_RETIRED:-}
      SOCKET_BROADCAST_KEY: ${SOCKET_BROADCAST_KEY:?generate with openssl rand -base64 32}
      JWT_SECRET: ${JWT_SECRET:?generate with openssl rand -hex 32}
      VALKEY_URL: valkey://:${VALKEY_PASSWORD:?generate with openssl rand -hex 24}@valkey:6379
      SOCKET_INTERNAL_URL: http://cronium-app:5002
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_HEALTH_PORT: 5003
      # Empty means the default in retention.ts; 0 keeps that data forever.
      CRONIUM_JOB_RETENTION_DAYS: ${CRONIUM_JOB_RETENTION_DAYS:-}
      CRONIUM_LOG_RETENTION_DAYS: ${CRONIUM_LOG_RETENTION_DAYS:-}
      CRONIUM_WORKFLOW_RETENTION_DAYS: ${CRONIUM_WORKFLOW_RETENTION_DAYS:-}
      CRONIUM_INCIDENT_RETENTION_DAYS: ${CRONIUM_INCIDENT_RETENTION_DAYS:-}
      CRONIUM_TOOL_ACTION_LOG_RETENTION_DAYS: ${CRONIUM_TOOL_ACTION_LOG_RETENTION_DAYS:-}
      CRONIUM_TOOL_AUDIT_LOG_RETENTION_DAYS: ${CRONIUM_TOOL_AUDIT_LOG_RETENTION_DAYS:-}
      CRONIUM_WEBHOOK_RETENTION_DAYS: ${CRONIUM_WEBHOOK_RETENTION_DAYS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CRONIUM_AI_ALLOW_PRIVATE_URLS: ${CRONIUM_AI_ALLOW_PRIVATE_URLS:-}
      # OAuth apps for tool integrations such as Google Sheets (optional). Also on the
      # worker, which runs those tools' actions and refreshes their tokens.
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_MICROSOFT_CLIENT_ID: ${OAUTH_MICROSOFT_CLIENT_ID:-}
      OAUTH_MICROSOFT_CLIENT_SECRET: ${OAUTH_MICROSOFT_CLIENT_SECRET:-}
      OAUTH_MICROSOFT_TENANT_ID: ${OAUTH_MICROSOFT_TENANT_ID:-}
      OAUTH_SLACK_CLIENT_ID: ${OAUTH_SLACK_CLIENT_ID:-}
      OAUTH_SLACK_CLIENT_SECRET: ${OAUTH_SLACK_CLIENT_SECRET:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5003/health', (r) => {r.resume(); r.on('end', () => process.exit(r.statusCode === 200 ? 0 : 1))}).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      cronium-app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cronium-network

  cronium-orchestrator:
    build:
      context: ../..
      dockerfile: apps/orchestrator/Dockerfile
    image: ghcr.io/addison-moore/cronium-orchestrator:${BUILD_VERSION:-latest}
    container_name: cronium-orchestrator
    # It exits at once when only container jobs are running: they carry on, and the
    # next orchestrator process picks them up. This is for what can't be left running
    # (remote jobs, and jobs still starting), which get up to 30s, plus 5s to clean up.
    stop_grace_period: 40s
    environment:
      CRONIUM_API_ENDPOINT: http://cronium-app:3000
      CRONIUM_API_TOKEN: ${CRONIUM_ORCHESTRATOR_KEY:?generate with openssl rand -base64 32}
      CRONIUM_ORCHESTRATOR_ID: ${ORCHESTRATOR_ID:-orchestrator-1}
      CRONIUM_CONTAINER_RUNTIME_JWT_SECRET: ${JWT_SECRET:?generate with openssl rand -hex 32}
      CRONIUM_CONTAINER_RUNTIME_BACKEND_URL: http://cronium-app:3000
      CRONIUM_CONTAINER_RUNTIME_VALKEY_URL: valkey://valkey:6379
      # Injected into each per-job runtime sidecar so it can authenticate to the
      # password-protected Valkey (the sidecar reads VALKEY_PASSWORD).
      CRONIUM_CONTAINER_RUNTIME_VALKEY_PASSWORD: ${VALKEY_PASSWORD:?generate with openssl rand -hex 24}
      # Per-job runtime sidecars join this network to reach the app and Valkey;
      # must match the network name declared at the bottom of this file.
      CRONIUM_CONTAINER_RUNTIME_SHARED_NETWORK: cronium-network
      # To run jobs in your own images. With no value, Compose passes one along only if
      # .env has it. See "The images a job runs in" in docs/DEPLOYMENT.md.
      CRONIUM_CONTAINER_IMAGES:
      CRONIUM_CONTAINER_RUNTIME_IMAGE:
      # SSH stays disabled unless an external launcher provides per-job OS
      # identity/container isolation. Never enable this for a shared SSH UID.
      CRONIUM_SSH_EXECUTION_ISOLATION_MODE: ${CRONIUM_SSH_EXECUTION_ISOLATION_MODE:-disabled}
      # The SSH reverse tunnel for remote (runner) execution dials this shared
      # runtime service; it MUST match the cronium-runtime service name:port.
      RUNTIME_HOST: cronium-runtime
      RUNTIME_PORT: 8081
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "/app/orchestrator", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - orchestrator_data:/app/data
    depends_on:
      cronium-app:
        condition: service_healthy
      valkey:
        condition: service_healthy
      cronium-runtime:
        condition: service_healthy
    restart: unless-stopped
    user: "0:0"
    networks:
      - cronium-network

  cronium-runtime:
    build:
      context: ../../apps/runtime/cronium-runtime
      dockerfile: Dockerfile
    image: ghcr.io/addison-moore/cronium-runtime:${BUILD_VERSION:-latest}
    container_name: cronium-runtime
    environment:
      RUNTIME_PORT: 8081
      RUNTIME_JWT_SECRET: ${JWT_SECRET:?generate with openssl rand -hex 32}
      RUNTIME_BACKEND_URL: http://cronium-app:3000
      RUNTIME_VALKEY_URL: valkey://valkey:6379
      RUNTIME_VALKEY_PASSWORD: ${VALKEY_PASSWORD:?generate with openssl rand -hex 24}
      RUNTIME_LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      cronium-app:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cronium-network

volumes:
  postgres_data:
    driver: local
  valkey_data:
    driver: local
  orchestrator_data:
    driver: local

networks:
  # Explicitly named so it doesn't vary with the compose project name — the
  # orchestrator attaches per-job runtime sidecars to it by this exact name.
  cronium-network:
    name: cronium-network
    driver: bridge
