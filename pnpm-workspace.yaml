packages:
  - apps/*
  - packages/*

# Security overrides for vulnerable transitive deps (Dependabot / pnpm audit).
# Each entry raises a transitive package to the first fixed release of its major
# and can be dropped once the parents' own ranges get there. CI gates on
# `pnpm audit --audit-level moderate`, so this list is what keeps that green.
overrides:
  # Pinned exactly by monaco-editor. <=3.4.16: SAFE_FOR_TEMPLATES bypass, IN_PLACE
  # hook removal leaving a detached subtree armed (XSS).
  dompurify@<3.4.17: ^3.4.17
  # uuid ^8 wanted by next-auth; esbuild ~0.18 via @esbuild-kit (drizzle-kit),
  # 0.27.x via tsup; postcss pinned exactly by next.
  uuid@<11.1.1: ^11.1.1
  postcss@<8.5.10: ^8.5.10
  esbuild@<0.25.0: ^0.25.0
  "esbuild@>=0.27.3 <0.28.1": ^0.28.1
  # libvips/libheif/librsvg advisories; arrives transitively through next.
  sharp@<0.35.5: ^0.35.5
  # All of these reach us through @google/genai > @modelcontextprotocol/sdk
  # (the SDK is unused at runtime here, but it is on the install path): request
  # size limits and OAuth credential routing in the SDK itself, host confusion /
  # SSRF in fast-uri, IP spoofing in proxy-addr, DoS in body-parser and qs, plus
  # ip-address and the hono family.
  "@modelcontextprotocol/sdk@<1.32.0": ^1.32.0
  fast-uri@<3.1.9: ^3.1.9
  proxy-addr@<2.0.8: ^2.0.8
  "body-parser@>=2.0.0 <2.4.0": ^2.4.0
  qs@<6.16.1: ^6.16.1
  ip-address@<10.7.4: ^10.7.4
  "@hono/node-server@<2.1.3": ^2.1.3
  hono@<4.13.11: ^4.13.11
  # nanoid 3.x arrives under postcss (via @tailwindcss/postcss and autoprefixer).
  # Constrained to the 3.x line so postcss's own range still resolves; the
  # unrelated nanoid 6.x in the tree is fine.
  "nanoid@>=3.0.0 <3.3.18": ^3.3.18
  # Build/test tooling only (jest, eslint, typography), but still gated by CI.
  brace-expansion@<1.1.21: ^1.1.21
  "brace-expansion@>=2.0.0 <2.1.7": ^2.1.7
  "brace-expansion@>=4.0.0 <5.0.12": ^5.0.12
  "js-yaml@>=3.0.0 <3.15.2": ^3.15.2
  "js-yaml@>=4.0.0 <4.3.2": ^4.3.2
  postcss-selector-parser@<6.1.5: ^6.1.5
  "glob@>=9.0.0 <14.0.2": ^14.0.2
  "minimatch@>=7.0.0 <11.0.1": ^11.0.1

allowBuilds:
  "@google/genai": false
  "@parcel/watcher": false
  "@swc/core": true
  bcrypt: true
  cpu-features: false
  esbuild: true
  protobufjs: false
  sharp: false
  ssh2: true
  unrs-resolver: false

onlyBuiltDependencies:
  - "@swc/core"
  - "@tailwindcss/oxide"
  - bcrypt
  - cpu-features
  - esbuild
  - sharp
  - ssh2
  - unrs-resolver
