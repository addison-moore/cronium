name: Install Smoke Test

# Builds the three images from source and runs install.sh exactly as a
# self-hoster would, asserting the stack comes up healthy and a fresh
# instance lands on the first-run setup page. This is the standing guard
# against drift between install.sh, docker-compose.example.yml, and the
# images' boot behavior.

on:
  push:
    branches: [main]
    paths:
      - install.sh
      - docker-compose.example.yml
      - apps/cronium-app/Dockerfile
      - apps/cronium-app/scripts/**
      - apps/orchestrator/Dockerfile
      - apps/runtime/cronium-runtime/Dockerfile
      - .github/workflows/install-smoke.yml
  pull_request:
    paths:
      - install.sh
      - docker-compose.example.yml
      - apps/cronium-app/Dockerfile
      - apps/cronium-app/scripts/**
      - apps/orchestrator/Dockerfile
      - apps/runtime/cronium-runtime/Dockerfile
      - .github/workflows/install-smoke.yml
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build images from source
        run: |
          docker build -t ghcr.io/addison-moore/cronium-app:latest \
            -f apps/cronium-app/Dockerfile .
          docker build -t ghcr.io/addison-moore/cronium-orchestrator:latest \
            -f apps/orchestrator/Dockerfile .
          docker build -t ghcr.io/addison-moore/cronium-runtime:latest \
            apps/runtime/cronium-runtime

      - name: Run installer
        env:
          CRONIUM_INSTALL_NO_PULL: "1"
          CRONIUM_INSTALL_COMPOSE_FILE: ${{ github.workspace }}/docker-compose.example.yml
        run: ./install.sh --url http://localhost:3000 --dir "$RUNNER_TEMP/cronium-smoke"

      - name: Assert app health endpoint
        run: curl -fsS http://localhost:3000/api/health

      - name: Assert socket port is loopback-only
        working-directory: ${{ runner.temp }}/cronium-smoke
        run: |
          binding=$(docker compose port cronium-app 5002)
          case "$binding" in
            127.0.0.1:*) echo "Socket bind is private: $binding" ;;
            *) echo "Socket port is not loopback-only: $binding"; exit 1 ;;
          esac

      - name: Assert security state cannot be evicted
        working-directory: ${{ runner.temp }}/cronium-smoke
        run: |
          # Valkey requires a password (requirepass); authenticate with the
          # generated VALKEY_PASSWORD from the install .env.
          vpw=$(grep -E '^VALKEY_PASSWORD=' .env | cut -d= -f2-)
          policy=$(docker compose exec -T valkey valkey-cli -a "$vpw" --no-auth-warning --raw CONFIG GET maxmemory-policy | tail -n 1)
          test "$policy" = "noeviction"

      - name: Assert fresh instance redirects to first-run setup
        run: |
          # Next.js may deliver the redirect as an HTTP 3xx or as a streamed
          # meta refresh in a 200 body — accept either.
          location=$(curl -s -o /dev/null -w '%{redirect_url}' http://localhost:3000/)
          echo "redirect header: ${location:-<none>}"
          case "$location" in
            */auth/setup*) echo "OK: HTTP redirect to setup"; exit 0 ;;
          esac
          if curl -s http://localhost:3000/ | grep -q 'url=/auth/setup'; then
            echo "OK: meta-refresh redirect to setup"
          else
            echo "Fresh instance did not redirect to /auth/setup"
            exit 1
          fi

      - name: Assert setup page renders
        run: |
          curl -fsS http://localhost:3000/auth/setup | grep -qi "admin" \
            || { echo "Setup page did not render an admin form"; exit 1; }

      - name: Assert every service reports healthy
        working-directory: ${{ runner.temp }}/cronium-smoke
        run: |
          for i in $(seq 1 36); do
            statuses=$(docker compose ps --format '{{.Name}} {{.Health}}')
            echo "$statuses"
            # Exactly "healthy" per line — "unhealthy" must not slip through —
            # and all six services present (postgres, valkey, app, worker,
            # orchestrator, runtime).
            if echo "$statuses" | awk '$2 != "healthy" {bad=1} END {exit (bad || NR < 6)}'; then
              echo "All services healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Services never became healthy"
          exit 1

      - name: Assert the secret maintenance CLI runs from the image
        working-directory: ${{ runner.temp }}/cronium-smoke
        run: |
          docker compose exec -T cronium-worker \
            node apps/cronium-app/dist/rotate-secrets.cjs --encrypt-legacy --dry-run

      - name: Assert it encrypts old values from the image
        working-directory: ${{ runner.temp }}/cronium-smoke
        run: |
          # A setting as the old encryption service stored it, under this instance's
          # key, and one in plaintext. Neither needs a user or an event to hang off.
          old=$(docker compose exec -T cronium-worker node -e '
            const crypto = require("crypto");
            const iv = crypto.randomBytes(16);
            const key = Buffer.from(process.env.ENCRYPTION_KEY, "hex");
            const cipher = crypto.createCipheriv("aes-256-gcm", key, iv);
            cipher.setAAD(Buffer.from("cronium-server-encryption"));
            const body = Buffer.concat([cipher.update("smoke-canary-old", "utf8"), cipher.final()]);
            process.stdout.write(Buffer.concat([iv, body, cipher.getAuthTag()]).toString("base64"));
          ')
          docker compose exec -T postgres psql -U cronium -d cronium -v ON_ERROR_STOP=1 -c \
            "INSERT INTO system_settings (key, value) VALUES ('smtpPassword', '$old'), ('openaiApiKey', 'smoke-canary-plain') ON CONFLICT (key) DO UPDATE SET value = EXCLUDED.value;"

          output=$(docker compose exec -T cronium-worker \
            node apps/cronium-app/dist/rotate-secrets.cjs --encrypt-legacy 2>&1)
          echo "$output"
          echo "$output" | grep -q 'system_settings: scanned=2 encrypted=2'
          echo "$output" | grep -q 'Legacy rows remaining: 0'
          if echo "$output" | grep -q 'smoke-canary'; then
            echo "A value reached the output"
            exit 1
          fi

          left=$(docker compose exec -T postgres psql -U cronium -d cronium -tAc \
            "SELECT count(*) FROM system_settings WHERE key IN ('smtpPassword', 'openaiApiKey') AND value NOT LIKE 'crn.1.%';")
          test "$left" = "0"

          # A second run decrypts both under their bindings, and writes nothing.
          again=$(docker compose exec -T cronium-worker \
            node apps/cronium-app/dist/rotate-secrets.cjs --encrypt-legacy 2>&1)
          echo "$again" | grep -q 'system_settings: scanned=2 encrypted=0 up-to-date=2'

      - name: Dump state on failure
        if: failure()
        working-directory: ${{ runner.temp }}/cronium-smoke
        run: |
          docker compose ps || true
          docker compose logs --tail 100 || true
