name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Supersede in-flight runs for the same ref instead of queueing them behind
# each other on the single self-hosted runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: "2.12.2"
  GOVULNCHECK_VERSION: "1.6.0"

jobs:
  node:
    name: Lint, Typecheck & Test (Node)
    # Pull requests stay on GitHub-hosted runners: this repo accepts PRs from
    # forks, and a fork PR running on self-hosted would execute untrusted code
    # on our own machine.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        # No version pin: pnpm/action-setup reads the `packageManager` field
        # from the root package.json, keeping CI and local dev on the same
        # pnpm automatically (a hardcoded pin here fails the action whenever
        # the two disagree).
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # --ignore-scripts skips native rebuilds (node-pty, cpu-features, bcrypt).
      # Lint, typecheck and the jest suite need none of them, and skipping the
      # builds means the runner does not need a C toolchain. The Docker image
      # build still compiles them, inside a container that has one.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (with coverage)
        run: pnpm test -- --coverage

      # Never-regress gate: fails when apps/cronium-app total coverage drops
      # more than 0.5pt below infra/scripts/coverage-baseline.json. When a PR
      # improves coverage, raise the baseline in the same PR to lock it in.
      - name: Coverage ratchet
        run: node infra/scripts/check-coverage-ratchet.mjs

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-cronium-app
          path: apps/cronium-app/coverage/lcov.info
          retention-days: 14

      - name: Security regression tests
        run: pnpm test:security

      # Supply-chain gate (3.5): fail on moderate/high/critical advisories in
      # the dependency tree. Transitive fixes are pinned via pnpm-workspace.yaml
      # overrides; a new advisory here means a dependency needs a bump or a new
      # override.
      #
      # Threshold is `moderate`, not `high`, so this matches what Dependabot
      # reports: the hono CORS ReDoS (GHSA-8j4g-w8fx-2239, moderate) was raised
      # by Dependabot but sailed through this gate. Two supply-chain checks with
      # different thresholds means the stricter one is the only one that counts.
      - name: Dependency audit (pnpm)
        run: pnpm audit --audit-level moderate

  storage:
    name: Storage Tests (Postgres)
    # Always GitHub-hosted (never self-hosted): the harness needs Docker to spin
    # up a throwaway Postgres + Valkey, and fork PRs must not run on our own
    # machines. ubuntu-latest ships Docker, so `pnpm test:storage` works as-is.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Spins up a disposable Postgres + Valkey, pushes the Drizzle schema, runs
      # the Storage Tests Jest project, then tears the containers down.
      - name: Storage layer tests
        run: pnpm test:storage

  e2e:
    name: E2E pipeline (full stack, real Docker)
    # Always GitHub-hosted: the harness needs its own Docker daemon (job
    # containers + runtime sidecars are real), and fork PRs must not run on
    # self-hosted machines. Boots a disposable stack — Postgres/Valkey/
    # orchestrator in containers, app + worker + socket server as host
    # processes — then a scheduled BASH event executes end-to-end and a
    # two-step workflow passes data through cronium_output → cronium_input.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # FULL install (no --ignore-scripts): unlike the pure-jest jobs, the app
      # actually RUNS here and its import graph needs the native modules
      # (bcrypt via the auth routers, node-pty via the socket server).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds the orchestrator/runtime/bash images, `next build`s the app,
      # boots everything, runs the E2E Jest project, and always tears down.
      # No build caching yet (repo pins all actions and doesn't use
      # actions/cache); if this job's wall-clock becomes a problem, caching
      # .next/cache and docker layers is the lever.
      - name: E2E pipeline tests
        run: pnpm test:e2e

  dependency-review:
    name: Dependency Review
    # dependency-review-action only runs on pull_request; it diffs the PR's
    # dependency manifest changes and fails on newly introduced vulnerable or
    # disallowed-license dependencies (3.5 supply-chain gate).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  sdk-sync:
    name: SDK Sync (container mirror vs canonical)
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The execution container images build from apps/runtime/container-images/
      # and COPY a byte-identical mirror of the canonical helpers in
      # apps/runtime/runtime-helpers/. Fail the build if they drift, so a fix to
      # the documented SDK can't ship without reaching the images (or vice versa).
      - name: Verify SDK copies are in sync
        run: bash scripts/check-sdk-sync.sh

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Tests the canonical Node runtime-helper SDK. The container-images/
      # mirror is byte-identical (enforced by the sync check above), so testing
      # the canonical copy covers both.
      - name: Runtime helper SDK tests (Node)
        working-directory: apps/runtime/runtime-helpers/nodejs
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx jest

  go:
    name: Vet & Test (Go)
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: |
            apps/orchestrator/go.sum
            apps/runtime/cronium-runtime/go.sum
            apps/runner/cronium-runner/go.sum

      # Installed with `go install` rather than upstream's install.sh. That
      # script greps checksums.txt for the tarball name unanchored, so it also
      # matches the "<tarball>.sbom.json" row that upstream added; the checksum
      # then never verifies and the step always fails. `go install` verifies
      # through the Go checksum database instead, and pins the version.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${{ env.GOLANGCI_LINT_VERSION }}

      # Coverage is reported per module (last line = total) and ratcheted
      # against the `go` section of infra/scripts/coverage-baseline.json —
      # same never-regress contract as the TS ratchet.
      - name: Vet & test orchestrator
        working-directory: apps/orchestrator
        run: |
          go vet ./...
          go test -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tail -n 1

      - name: Vet & test runtime
        working-directory: apps/runtime/cronium-runtime
        run: |
          go vet ./...
          go test -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tail -n 1

      - name: Vet & test runner
        working-directory: apps/runner/cronium-runner
        run: |
          go vet ./...
          go test -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tail -n 1

      # The ratchet script needs node. GitHub-hosted runners have it on PATH,
      # the self-hosted runner (used for pushes) does not — set it up
      # explicitly so the job is hermetic on both.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Go coverage ratchet
        run: node infra/scripts/check-go-coverage-ratchet.mjs

      # Supply-chain gate (3.4): fail when a known vulnerability is reachable
      # from our code. Requires the pinned patched toolchain (go 1.25.12) so the
      # standard-library findings resolve; run per-module so each go.mod's
      # dependency graph is analyzed.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v${{ env.GOVULNCHECK_VERSION }}

      - name: govulncheck (Go modules)
        run: |
          for m in apps/orchestrator apps/runtime/cronium-runtime apps/runner/cronium-runner; do
            echo "== govulncheck $m =="
            (cd "$m" && govulncheck ./...)
          done

      # Advisory for now. golangci-lint never actually ran (its installer was
      # broken and lint-go.sh swallowed the resulting error), so there is a
      # backlog of ~276 findings in orchestrator and ~58 in runtime. The steps
      # report them without failing the build. Remove continue-on-error once the
      # backlog is cleared, so Go lint regressions block CI like the Node ones.
      - name: Lint (golangci-lint) orchestrator
        working-directory: apps/orchestrator
        run: ../../infra/scripts/lint-go.sh
        continue-on-error: true

      - name: Lint (golangci-lint) runtime
        working-directory: apps/runtime/cronium-runtime
        run: ../../../infra/scripts/lint-go.sh
        continue-on-error: true

  # The container-hardening integration test creates a REAL container and
  # inspects it via the Docker API (build tag `integration`); before this job
  # existed it never ran anywhere. Pinned to ubuntu-latest, which always has a
  # Docker daemon; alpine is pre-pulled because the test skips (rather than
  # pulls) when the image is absent.
  go-container-integration:
    name: Container hardening (integration, real Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: apps/orchestrator/go.sum

      - name: Pull alpine (integration test never pulls)
        run: docker pull alpine:latest

      - name: Integration tests (container executor)
        working-directory: apps/orchestrator
        run: |
          set -o pipefail
          go test -tags=integration -count=1 -v ./internal/executors/container/ | tee /tmp/itest.out
          # The test self-skips when Docker/alpine is unavailable; on this
          # runner that would mean the job silently proved nothing — fail.
          if grep -q -- "--- SKIP: TestCreatedContainerHasHardenedHostConfig" /tmp/itest.out; then
            echo "hardening integration test was skipped — Docker/alpine unavailable" >&2
            exit 1
          fi
