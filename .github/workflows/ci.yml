name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Supersede in-flight runs for the same ref instead of queueing them behind
# each other on the single self-hosted runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: "2.12.2"

jobs:
  node:
    name: Lint, Typecheck & Test (Node)
    # Pull requests stay on GitHub-hosted runners: this repo accepts PRs from
    # forks, and a fork PR running on self-hosted would execute untrusted code
    # on our own machine.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --ignore-scripts skips native rebuilds (node-pty, cpu-features, bcrypt).
      # Lint, typecheck and the jest suite need none of them, and skipping the
      # builds means the runner does not need a C toolchain. The Docker image
      # build still compiles them, inside a container that has one.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  sdk-sync:
    name: SDK Sync (container mirror vs canonical)
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The execution container images build from apps/runtime/container-images/
      # and COPY a byte-identical mirror of the canonical helpers in
      # apps/runtime/runtime-helpers/. Fail the build if they drift, so a fix to
      # the documented SDK can't ship without reaching the images (or vice versa).
      - name: Verify SDK copies are in sync
        run: bash scripts/check-sdk-sync.sh

  go:
    name: Vet & Test (Go)
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            apps/orchestrator/go.sum
            apps/runtime/cronium-runtime/go.sum
            apps/runner/cronium-runner/go.sum

      # Installed with `go install` rather than upstream's install.sh. That
      # script greps checksums.txt for the tarball name unanchored, so it also
      # matches the "<tarball>.sbom.json" row that upstream added; the checksum
      # then never verifies and the step always fails. `go install` verifies
      # through the Go checksum database instead, and pins the version.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${{ env.GOLANGCI_LINT_VERSION }}

      - name: Vet & test orchestrator
        working-directory: apps/orchestrator
        run: |
          go vet ./...
          go test ./...

      - name: Vet & test runtime
        working-directory: apps/runtime/cronium-runtime
        run: |
          go vet ./...
          go test ./...

      - name: Vet & test runner
        working-directory: apps/runner/cronium-runner
        run: |
          go vet ./...
          go test ./...

      # Advisory for now. golangci-lint never actually ran (its installer was
      # broken and lint-go.sh swallowed the resulting error), so there is a
      # backlog of ~276 findings in orchestrator and ~58 in runtime. The steps
      # report them without failing the build. Remove continue-on-error once the
      # backlog is cleared, so Go lint regressions block CI like the Node ones.
      - name: Lint (golangci-lint) orchestrator
        working-directory: apps/orchestrator
        run: ../../infra/scripts/lint-go.sh
        continue-on-error: true

      - name: Lint (golangci-lint) runtime
        working-directory: apps/runtime/cronium-runtime
        run: ../../../infra/scripts/lint-go.sh
        continue-on-error: true
